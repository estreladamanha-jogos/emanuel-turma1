<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucas Emanuel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #1f2937;
      background: #f3f4f6;
    }

    .header {
      padding: 32px 16px;
      text-align: center;
      color: #ffffff;
      background: #2563eb;
    }

    .header h1 {
      font-size: 1.8rem;
    }

    .main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .card {
      margin-bottom: 16px;
      padding: 20px;
      border-radius: 12px;
      background: #ffffff;
    }

    .card h2 {
      margin-bottom: 8px;
      font-size: 1.2rem;
      color: #2563eb;
    }

    .card ul {
      padding-left: 20px;
    }

    .footer {
      padding: 16px;
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Área de trabalho do Lucas Emanuel</h1>
    <p>Turma 1</p>
  </header>

  <main class="main">
    <section class="card">
      <h2>Sobre mim</h2>
      <p>Escreva aqui quem você é e do que você gosta.</p>
    </section>

    <section class="card">
      <h2>Meus projetos</h2>
      <!-- Adicione um item para cada projeto novo -->
      <ul>
        <li>Projeto 1 – em breve</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>Feito por Lucas Emanuel</p>
  </footer>
</body>
</html>
